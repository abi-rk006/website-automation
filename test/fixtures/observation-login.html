<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enterprise Portal</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .container { background: #1e293b; padding: 32px; border-radius: 12px; width: 360px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    h1 { font-size: 20px; margin-bottom: 24px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    input { width: 100%; padding: 10px; background: #334155; border: 1px solid #475569; border-radius: 6px; color: white; box-sizing: border-box; }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn { flex: 1; padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
    .btn-secondary { background: #475569; color: #cbd5e1; }
    .btn-primary { background: #3b82f6; color: white; }
    #status-display { margin-top: 16px; text-align: center; font-size: 14px; color: #34d399; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Service Portal Authentication</h1>
    <div class="form-group">
      <label for="user-id">Username / Email</label>
      <input type="text" id="user-id" placeholder="user@company.com">
    </div>
    <div class="form-group">
      <label for="user-pw">Password</label>
      <input type="password" id="user-pw" placeholder="••••••••">
    </div>
    <div class="actions">
      <button type="button" class="btn btn-secondary">Help</button>
      <button type="button" id="login-button" class="btn btn-primary" onclick="handleLogin()">Login</button>
    </div>
    <div id="status-display">Authenticated successfully! Session active.</div>
  </div>

  <script>
    function handleLogin() {
      document.getElementById('status-display').style.display = 'block';
    }
  </script>
</body>
</html>
